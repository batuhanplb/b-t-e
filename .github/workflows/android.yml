name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      # Android SDK ubuntu-latest üzerinde hazır kurulu (ANDROID_HOME); ayrı kurulum adımı gerekmiyor.
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Web dosyalarını hazırla
        run: bash scripts/build-app.sh
      - name: Yalnızca Capacitor paketlerini kur
        run: |
          mv package.json package.web.json
          echo '{"name":"butce-app","private":true}' > package.json
          npm install --no-package-lock --ignore-scripts typescript@5 @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/status-bar@7 @capacitor/splash-screen@7 @capacitor/browser@7 @capgo/capacitor-updater@7
          cat package.json
      - run: npx cap sync android
      - name: Eklentileri doğrula
        run: |
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q BrowserPlugin android/app/src/main/assets/capacitor.plugins.json
          grep -q CapacitorUpdaterPlugin android/app/src/main/assets/capacitor.plugins.json
      - name: APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: butce-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Telefondan tek dokunuşla indirilebilen sabit bağlantı:
      # https://github.com/batuhanplb/b-t-e/releases/latest/download/butce.apk
      - name: APK'yı sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk butce.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest butce.apk \
            --title "APK (otomatik derleme)" \
            --notes "Web değişiklikleri havadan gelir; bu APK yalnızca kabuk (eklenti/izin/ikon) değişince gerekir."
