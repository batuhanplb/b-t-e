name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      # Android SDK ubuntu-latest üzerinde hazır kurulu (ANDROID_HOME); ayrı kurulum adımı gerekmiyor.
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Web dosyalarını hazırla
        run: bash scripts/build-app.sh
      - name: Yalnızca Capacitor paketlerini kur
        run: |
          mv package.json package.web.json
          echo '{"name":"butce-app","private":true}' > package.json
          npm install --no-save --no-package-lock --ignore-scripts @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/status-bar@7 @capacitor/splash-screen@7
      - run: npx cap sync android
      - name: APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: butce-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
