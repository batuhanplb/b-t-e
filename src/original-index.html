<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Bütçe</title>
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bütçe">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f5f5f3; --surface:#ffffff; --sunk:#ececea; --ink:#1b1d1f; --muted:#6a6f74; --faint:#9a9fa3; --line:#e4e4e0;
  --exp:#c53a2e; --inc:#1d7f47; --tr:#3166c9; --primary:#0f6e66; --on-primary:#ffffff; --hero:#0f4c47;
  --paid:#b5d9a1; --paid-ink:#234f17; --due:#9a5b0e; --due-bg:#f7e8cf; --sub:#e3eedb; --focus:#3166c9;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media not all{
  :root{
    --bg:#121416; --surface:#1a1d20; --sunk:#24282c; --ink:#e7eaec; --muted:#a2a8ad; --faint:#737a80; --line:#2b3034;
    --exp:#f07a6c; --inc:#5fc58a; --tr:#7aa5f0; --primary:#3cc7b4; --on-primary:#06201d; --hero:#123f3b;
    --paid:#3d6331; --paid-ink:#e2f3d8; --due:#f0b660; --due-bg:#3a2d17; --sub:#26362a; --focus:#7aa5f0;
    color-scheme: dark;
  }
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font:15px/1.4 var(--font); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }

/* frame */
.top{ position:sticky; top:0; z-index:10; background:var(--bg); padding:env(safe-area-inset-top,0px) 16px 0; }
.top-in{ height:52px; display:flex; align-items:center; gap:8px; max-width:1100px; margin:0 auto; }
.top h1{ font-size:20px; font-weight:700; margin:0; flex:1; letter-spacing:-.01em; }
.ib{ width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:var(--ink); }
.ib:active{ background:var(--sunk); }
.ib svg{ width:22px; height:22px; }
main{ max-width:1100px; margin:0 auto; padding:4px 16px calc(150px + env(safe-area-inset-bottom,0px)); }
nav.tabs{ position:fixed; z-index:20; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(8,1fr); padding-bottom:env(safe-area-inset-bottom,0px); }
nav.tabs button{ min-width:0; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
nav.tabs button svg{ width:22px; height:22px; }
nav.tabs button[aria-current="page"]{ color:var(--primary); font-weight:600; }
.fab{ position:fixed; z-index:21; right:16px; bottom:calc(68px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:16px; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; box-shadow:0 4px 14px rgba(0,0,0,.22); }
.fab svg{ width:26px; height:26px; }
@media (min-width:900px){
  nav.tabs{ top:0; right:auto; width:210px; border-top:0; border-right:1px solid var(--line); grid-template-columns:1fr; align-content:start; padding:calc(64px + env(safe-area-inset-top,0px)) 10px 0; gap:2px; }
  nav.tabs button{ height:42px; flex-direction:row; justify-content:flex-start; gap:12px; padding:0 12px; font-size:14px; border-radius:9px; }
  nav.tabs button[aria-current="page"]{ background:color-mix(in srgb, var(--primary) 12%, transparent); }
  .top{ padding-left:226px; }
  main{ padding-left:226px; padding-bottom:60px; }
  .fab{ bottom:24px; right:24px; }
}

/* blocks */
.sec{ margin-top:22px; }
.sec-h{ display:flex; align-items:baseline; gap:8px; margin:0 2px 8px; }
.sec-h h2{ font-size:13px; font-weight:700; color:var(--primary); margin:0; flex:1; }
.sec-h .lnk{ font-size:13px; color:var(--tr); }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.muted{ color:var(--muted); } .small{ font-size:13px; } .neg{ color:var(--exp); } .pos{ color:var(--inc); }
.grid2{ display:grid; gap:0 22px; }
.grid2>div{ min-width:0; }
@media (min-width:900px){ .grid2{ grid-template-columns:1fr 1fr; } }

.net{ display:flex; align-items:baseline; justify-content:space-between; padding:14px 16px 4px; }
.net b{ font-size:22px; font-weight:700; letter-spacing:-.01em; }
.accs{ display:flex; overflow-x:auto; scrollbar-width:none; padding:6px 8px 12px; gap:0; }
.accs::-webkit-scrollbar{ display:none; }
.acc{ flex:0 0 auto; min-width:118px; padding:6px 10px; border-left:1px solid var(--line); text-align:left; }
.acc:first-child{ border-left:0; }
.acc .n{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap; }
.acc .n i{ width:8px; height:8px; border-radius:2px; display:inline-block; }
.acc .v{ font-weight:600; margin-top:2px; white-space:nowrap; }

.sum{ display:grid; grid-template-columns:1fr 1fr 1fr; padding:12px 16px; gap:8px; }
.sum div{ font-size:12px; color:var(--muted); }
.sum b{ display:block; font-size:16px; color:var(--ink); font-weight:600; margin-top:1px; }
.bars{ padding:2px 16px 12px; }
.bar-row{ display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:6px 0; }
.bar-row .bt{ font-size:14px; }
.bar-row .bv{ font-size:14px; font-weight:600; }
.bar-row .bb{ grid-column:1/-1; height:4px; background:var(--sunk); border-radius:2px; overflow:hidden; }
.bar-row .bb i{ display:block; height:100%; border-radius:2px; }

.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 12px; font-size:14px; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.chip i{ width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.chip[aria-pressed="true"]{ background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
.scroll-x{ display:flex; overflow-x:auto; gap:8px; scrollbar-width:none; padding-bottom:2px; }
.scroll-x::-webkit-scrollbar{ display:none; }

.list{ list-style:none; margin:0; padding:0; }
.list>li+li{ border-top:1px solid var(--line); }
.tx{ width:100%; display:flex; align-items:center; gap:12px; padding:11px 14px; text-align:left; }
.tx:active{ background:var(--sunk); }
.cic{ width:36px; height:36px; border-radius:11px; flex:none; display:grid; place-items:center; color:var(--c); background:color-mix(in srgb, var(--c) 15%, transparent); }
.cic svg{ width:19px; height:19px; }
.netcard{ background:var(--hero); border-color:transparent; color:#fff; }
.netcard .muted, .netcard .acc .n{ color:rgba(255,255,255,.72); }
.netcard .neg{ color:#ffb3a7; }
.netcard .acc{ border-left-color:rgba(255,255,255,.16); }
.sh th.click:hover{ text-decoration:underline; }
.tx .m{ flex:1; min-width:0; }
.tx .t{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tx .s{ display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tx .a{ font-weight:600; white-space:nowrap; }
.tx.future .t, .tx.future .a{ opacity:.6; }
.day{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:600; padding:16px 4px 6px; }
.empty{ padding:24px 16px; text-align:center; color:var(--muted); font-size:14px; }

.monthbar{ display:flex; align-items:center; gap:4px; }
.monthbar .l{ font-weight:600; min-width:104px; text-align:center; font-size:15px; }
.toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0 12px; }
.seg{ display:inline-flex; background:var(--sunk); border-radius:10px; padding:3px; }
.seg button{ padding:7px 12px; border-radius:8px; font-size:14px; color:var(--muted); font-weight:500; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
.search{ flex:1; min-width:160px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:9px 12px; }
select.sel{ border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 10px; }

.status{ border-radius:999px; padding:5px 10px; font-size:12px; font-weight:600; white-space:nowrap; }
.status.paid{ background:var(--paid); color:var(--paid-ink); }
.status.due{ background:var(--due-bg); color:var(--due); }
.tag{ font-size:11px; font-weight:600; padding:2px 7px; border-radius:999px; background:var(--sunk); color:var(--muted); }

/* debts */
.debts{ display:grid; gap:10px; }
@media (min-width:700px){ .debts{ grid-template-columns:1fr 1fr; } }
.debt{ text-align:left; padding:14px 16px; width:100%; }
.debt .hd{ display:flex; align-items:center; gap:8px; }
.debt .nm{ font-weight:600; flex:1; }
.debt .pr{ height:6px; background:var(--sunk); border-radius:3px; overflow:hidden; margin:10px 0; }
.debt .pr i{ display:block; height:100%; background:var(--inc); }
.debt .kv{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12px; color:var(--muted); }
.debt .kv b{ display:block; font-size:14px; color:var(--ink); font-weight:600; }
.kpis{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.kpi{ padding:12px 14px; }
.kpi span{ font-size:12px; color:var(--muted); }
.kpi b{ display:block; font-size:18px; font-weight:700; margin-top:2px; }

/* tables */
.tw{ overflow:auto; max-height:calc(100dvh - 250px - env(safe-area-inset-bottom,0px)); border:1px solid var(--line); border-radius:10px; background:var(--surface); }
@media (min-width:900px){ .tw{ max-height:calc(100dvh - 190px); } }
table.sh{ border-collapse:separate; border-spacing:0; font-size:13px; min-width:100%; }
.sh th,.sh td{ padding:6px 9px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); white-space:nowrap; text-align:right; }
.sh thead th{ position:sticky; top:0; z-index:2; background:var(--sunk); font-weight:600; }
.sh th:first-child,.sh td:first-child{ position:sticky; left:0; z-index:1; background:var(--surface); text-align:left; font-weight:600; }
.sh thead th:first-child{ z-index:3; background:var(--sunk); }
.sh tfoot{ position:sticky; bottom:0; z-index:2; }
.sh tfoot td,.sh tfoot td:first-child{ background:var(--sunk); font-weight:700; }
.sh .st{ background:var(--sub)!important; font-weight:600; }
.sh td.paid{ background:var(--paid); color:var(--paid-ink); }
.sh tr.cur td{ box-shadow:inset 0 2px 0 var(--ink), inset 0 -2px 0 var(--ink); }
.sh td.fut{ color:var(--faint); }
.sh th.click{ cursor:pointer; }
.sh th .hs{ display:block; font-weight:400; font-size:11px; color:var(--muted); }
.sh tr.meta td{ color:var(--muted); font-size:12px; }

/* sheet */
dialog.sheet{ border:0; padding:0; margin:0; width:100%; max-width:100%; height:100%; max-height:100%; background:var(--bg); color:var(--ink); }
dialog.sheet::backdrop{ background:rgba(0,0,0,.4); }
@media (min-width:700px){ dialog.sheet{ margin:auto; width:560px; height:auto; max-height:90vh; border-radius:14px; } }
.sh-in{ display:flex; flex-direction:column; height:100%; max-height:inherit; }
.sh-hd{ display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px; border-bottom:1px solid var(--line); background:var(--surface); }
.sh-hd h3{ flex:1; margin:0; font-size:17px; font-weight:600; }
.sh-hd.e{ border-top:3px solid var(--exp); } .sh-hd.i{ border-top:3px solid var(--inc); } .sh-hd.tr{ border-top:3px solid var(--tr); }
.sh-bd{ flex:1; overflow:auto; padding:14px 16px; -webkit-overflow-scrolling:touch; }
.sh-ft{ display:flex; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--surface); }
.btn{ flex:1; height:46px; border-radius:11px; font-weight:600; background:var(--primary); color:var(--on-primary); }
.btn.ghost{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
.btn.danger{ background:var(--surface); color:var(--exp); border:1px solid var(--line); flex:0 0 auto; padding:0 16px; }
.btn.sm{ height:36px; flex:0 0 auto; padding:0 14px; font-size:14px; border-radius:9px; }
.fld{ display:block; margin-bottom:14px; }
.fld>span{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.in{ width:100%; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:11px 12px; font-size:16px; }
.in.amt{ font-size:30px; font-weight:700; text-align:right; padding:8px 12px; letter-spacing:-.01em; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
.sugg{ margin:-8px 0 12px; }
.sugg button{ display:flex; width:100%; justify-content:space-between; gap:10px; padding:9px 12px; border:1px solid var(--line); border-top:0; background:var(--surface); text-align:left; font-size:14px; }
.sugg button:first-child{ border-top:1px solid var(--line); border-radius:10px 10px 0 0; }
.sugg button:last-child{ border-radius:0 0 10px 10px; }
.sugg button:only-child{ border-radius:10px; }
.sugg span{ color:var(--muted); font-size:12px; }
.catsel{ display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; border:1px solid var(--line); background:var(--surface); border-radius:10px; text-align:left; font-size:16px; }
.catsel i{ width:12px; height:12px; border-radius:3px; flex:none; }
.catsel span{ flex:1; }
.catpanel{ margin-top:10px; }
.catpanel .grp{ margin-bottom:10px; }
.catpanel .grp>div{ font-size:12px; color:var(--muted); margin:0 0 6px 2px; }
.err{ color:var(--exp); font-size:13px; margin:-6px 0 12px; }
.sched{ width:100%; border-collapse:collapse; font-size:14px; }
.sched td{ padding:4px 6px; border-bottom:1px solid var(--line); }
.sched input{ width:100%; border:1px solid transparent; background:transparent; border-radius:7px; padding:6px; text-align:right; }
.sched input:focus{ border-color:var(--line); background:var(--surface); }
.sched tr.cur td:first-child{ font-weight:700; }
.schedwrap{ max-height:300px; overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface); margin-bottom:10px; }
.plan{ background:var(--sunk); border-radius:10px; padding:12px; margin-bottom:12px; }
.set-row{ display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; text-align:left; }
.set-row .grow{ flex:1; min-width:0; }
.set-row i{ width:10px; height:10px; border-radius:3px; flex:none; }

.login{ min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; }
.login h1{ font-size:28px; margin:0; }
.login .btn{ flex:0 0 auto; padding:0 22px; display:inline-flex; align-items:center; gap:10px; }
.boot{ min-height:100dvh; display:grid; place-items:center; color:var(--muted); }
.toast{ position:fixed; z-index:60; left:50%; transform:translateX(-50%); bottom:calc(140px + env(safe-area-inset-bottom,0px)); background:var(--primary); color:var(--on-primary); padding:10px 16px; border-radius:10px; font-size:14px; max-width:90vw; }
.offline{ background:var(--due-bg); color:var(--due); font-size:13px; text-align:center; padding:6px; }
.sh th,.sh td{ padding:9px 12px; border-right:0; }
.sh thead th,.sh thead th:first-child{ background:var(--surface); color:var(--muted); font-size:12px; border-bottom:1px solid var(--ink); }
.sh .st{ background:transparent!important; font-weight:700; color:var(--ink); border-left:1px solid var(--line); }
.sh td.paid{ background:transparent; color:var(--faint); }
.sh td.paid::before{ content:"✓ "; color:var(--inc); }
.sh tbody tr:hover td{ background:color-mix(in srgb, var(--primary) 5%, var(--surface)); }
.sh tr.cur td{ box-shadow:none; background:color-mix(in srgb, var(--primary) 10%, var(--surface)); }
.sh td.past{ text-align:left; color:var(--primary); font-weight:600; cursor:pointer; }
.pen{ opacity:.35; width:34px; height:34px; } .catrow:hover .pen{ opacity:1; }
.catrow .grow{ padding:4px 0; font-size:15px; }
.pie{ display:flex; justify-content:center; padding:16px; position:relative; }
.pie-c{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.pie-c b{ font-size:18px; }
/* canlı tema */
:root{ --bg:#f4f6fb; --sunk:#edf0f7; --line:#e3e7ef; --primary:#0d9488; --hero:#0d9488; --g1:#0d9488; --g2:#4f7cf5;
  --c1:#e0f2fe; --c1i:#0369a1; --c2:#ede9fe; --c2i:#6d28d9; --c3:#dcfce7; --c3i:#15803d; --c4:#ffedd5; --c4i:#c2410c; --c5:#fce7f3; --c5i:#be185d; }
@media not all{ :root{ --bg:#11141a; --sunk:#1d222b; --line:#2a303a; --primary:#2dd4bf; --g1:#0f766e; --g2:#3b5bdb;
  --c1:#0f2a3d; --c1i:#7dd3fc; --c2:#241d3d; --c2i:#c4b5fd; --c3:#12301f; --c3i:#86efac; --c4:#3a2512; --c4i:#fdba74; --c5:#3a1529; --c5i:#f9a8d4; } }
.netcard{ background:linear-gradient(135deg, var(--g1), var(--g2)); }
.fab{ background:linear-gradient(135deg, var(--g1), var(--g2)); color:#fff; }
.kpis .kpi:nth-child(1){ background:var(--c3); border-color:transparent; } .kpis .kpi:nth-child(1) span{ color:var(--c3i); }
.kpis .kpi:nth-child(2){ background:var(--c4); border-color:transparent; } .kpis .kpi:nth-child(2) span{ color:var(--c4i); }
.sum div:nth-child(1){ color:var(--c5i); } .sum div:nth-child(2){ color:var(--c3i); } .sum div:nth-child(3){ color:var(--c1i); }
.tag{ background:var(--c2); color:var(--c2i); }
.sec-h h2{ color:var(--c2i); }
.chip[aria-pressed="true"]{ background:var(--primary); border-color:var(--primary); color:#fff; }
.seg button[aria-pressed="true"]{ color:var(--primary); }
.sh thead th,.sh thead th:first-child{ background:var(--c1); color:var(--c1i); border-bottom-color:transparent; }
.sh tfoot td,.sh tfoot td:first-child{ background:var(--c2); color:var(--c2i); }
.sh tr.cur td{ background:var(--c3); }
.day{ color:var(--c2i); }
.sh-hd{ background:linear-gradient(90deg, color-mix(in srgb, var(--g1) 10%, var(--surface)), color-mix(in srgb, var(--g2) 10%, var(--surface))); }
.cic img{ width:100%; height:100%; object-fit:cover; border-radius:inherit; }
.icgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:6px; }
.icb{ height:44px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--c); display:grid; place-items:center; font-size:12px; }
.icb svg{ width:20px; height:20px; }
.icb[aria-pressed="true"]{ background:color-mix(in srgb, var(--c) 18%, var(--surface)); border-color:var(--c); }
/* tablo hizalama düzeltmesi */
.sh .st{ font-weight:700; color:var(--ink); border-left:1px solid var(--line); }
.sh td.st,.sh th.st{ background:var(--surface)!important; }
.sh thead th.st{ background:var(--c1)!important; color:var(--c1i); }
.sh tfoot td.st{ background:var(--c2)!important; color:var(--c2i); }
.sh tr.cur td.st{ background:var(--c3)!important; }
.sh tr > .st:last-child{ position:sticky; right:0; z-index:1; box-shadow:-6px 0 8px -6px rgba(0,0,0,.18); }
.sh thead tr > .st:last-child, .sh tfoot tr > .st:last-child{ z-index:4; }
.sh td.past{ position:static; background:var(--surface); padding:10px 12px; }
.sh td.past .pst{ position:sticky; left:12px; }
/* kalan nakit */
.cashbars{ display:flex; align-items:flex-end; gap:3px; height:180px; padding:12px 6px 8px; overflow-x:auto; }
